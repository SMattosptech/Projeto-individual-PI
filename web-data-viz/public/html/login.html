<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlayGuitar | Login</title>

    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <img class="imagem-fundo-login" src="../assets/imgs/img-fundo-login.jpg" alt="Guitarra PlayGuitar">

    <!-- Cabeçalho (Idêntico ao da home) -->
    <header class="cabecalho">
        <div class="esquerda">
            <a href="../index.html">
                <img id="logo" src="../assets/imgs/logo.png" alt="Logo PlayGuitar">
            </a>
            <h1 id="titulo">PlayGuitar</h1>
        </div>

        <nav class="navegacao">
            <a href="../index.html">Voltar para a home</a>
        </nav>
    </header>

    <!-- Área principal dividida -->
    <main class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>

        <!-- Painel Esquerdo: Textos originais preservados -->
        <section class="painel-boas-vindas">
            <div class="selo-wrapper">
                <span class="selo">MINHA VIDA EM SEIS CORDAS</span>
            </div>
            <h2>Afine, entre e toque.</h2>
            <p>
                Acesse sua conta para acompanhar conteúdos sobre guitarra,
                músicas, dicas e técnicas.
            </p>
        </section>

        <!-- Painel Direito: O Formulário Redesenhado -->
        <section class="container">
            <div class="card-login">
                <div class="card-header-text">
                    <h2>Bem-vindo de volta</h2>
                    <p class="sub-aviso">Insira suas credenciais para continuar.</p>
                </div>

                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="email" placeholder="seuemail@exemplo.com">
                    </div>

                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>

                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <p class="link-cadastro">
                    Ainda não possui uma conta? <a href="cadastro.html">Crie uma</a>
                </p>

                <div id="div_aguardar" class="loading-div">
                    <img src="../assets/circle-loading.gif" id="loading-gif" alt="Carregando...">
                </div>

                <div id="div_erros_login"></div>
            </div>
        </section>
    </main>

</body>

<script>


 
function entrar() {
    let emailVar = email_input.value;
    let senhaVar = senha_input.value;

    // Verificando se os campos estão vazios
    if (emailVar == "" || senhaVar == "") {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Preencha todos os campos.";
        setTimeout(sumirMensagem, 5000);
        return false;
    }

    // Iniciando o carregamento
    aguardar();

    fetch("/usuarios/autenticar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            emailServer: emailVar,
            senhaServer: senhaVar
        })
    }).then(function (resposta) {

        if (resposta.ok) {
            resposta.json().then(function (json) {

                // Guardando os dados do usuário
                sessionStorage.ID_USUARIO = json.id_usuario;
                sessionStorage.NOME_USUARIO = json.nome;
                sessionStorage.EMAIL_USUARIO = json.email;

                // Verificando se o usuário já preencheu o perfil
                    setTimeout(function () {
                    if (json.possuiPerfil) {
                        window.location = "dashboard.html";
                    } else {
                        window.location = "formulario.html";
                    }
                }, 1000);

            });

        } else {
            resposta.text().then(function (texto) {
                finalizarAguardar();
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = texto;
                setTimeout(sumirMensagem, 5000);
            });
        }

    }).catch(function (erro) {
        console.log(erro);
        finalizarAguardar();

        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "Não foi possível realizar o login. Tente novamente.";
        setTimeout(sumirMensagem, 5000);
    });

    return false;
}

function sumirMensagem() {
    cardErro.style.display = "none";
}


</script>
<script src="../js/navegacao.js"></script>
