<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PlayGuitar | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <img class="imagem-fundo-login" src="../assets/imgs/img-fundo-login.jpg" alt="Guitarra PlayGuitar">

    <!-- Cabeçalho (Idêntico ao da home) -->
    <header class="cabecalho">
        <div class="esquerda">
            <a href="../playguitar.html">
                <img id="logo" src="../assets/imgs/logo.png" alt="Logo PlayGuitar">
            </a>
            <h1 id="titulo">PlayGuitar</h1>
        </div>

        <nav class="navegacao">
            <a href="login.html" id="login">Login</a>
            <a href="cadastro.html" id="cadastro">Cadastro</a>
            <a href="../html/contato.html" id="contatos">Contato</a>
        </nav>
    </header>

    <!-- Área principal dividida -->
    <main class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>

        <!-- Painel Esquerdo: Textos originais preservados -->
        <section class="painel-boas-vindas">
            <div class="selo-wrapper">
                <span class="selo">MINHA VIDA EM SEIS CORDAS</span>
            </div>
            <h2>Afine, entre e toque.</h2>
            <p>
                Acesse sua conta para acompanhar conteúdos sobre guitarra,
                músicas, dicas e técnicas.
            </p>
        </section>

        <!-- Painel Direito: O Formulário Redesenhado -->
        <section class="container">
            <div class="card-login">
                <div class="card-header-text">
                    <h2>Bem-vindo de volta</h2>
                    <p class="sub-aviso">Insira suas credenciais para continuar.</p>
                </div>

                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="seuemail@exemplo.com">
                    </div>

                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>

                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <p class="link-cadastro">
                    Ainda não possui uma conta? <a href="cadastro.html">Crie uma</a>
                </p>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando...">
                </div>

                <div id="div_erros_login"></div>
            </div>
        </section>
    </main>

</body>

<script>


    function entrar() {
        aguardar();

        let emailVar = email_input.value;
        let senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
